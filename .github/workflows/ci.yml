name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          # Build golangci-lint with the project's Go (1.26) via go install, so its
          # built-with-Go version isn't lower than our go.mod target (otherwise it
          # refuses with exit 3). The prebuilt "latest" binary lags new Go releases.
          version: v1.64.8
          install-mode: goinstall

  web:
    name: dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mxsentinel:ci
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: mxsentinel-dashboard:ci
      - name: Validate compose config
        run: docker compose -f deploy/docker-compose.yml config >/dev/null

  schema-lint:
    name: validate event schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate event JSON Schemas parse
        run: |
          for f in schemas/events/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))" && echo "ok: $f"
          done
