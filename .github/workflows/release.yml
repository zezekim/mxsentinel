name: release

# Build and push the service + dashboard images to GHCR on a version tag (e.g. v1.0.0).
# Pull them on a VPS instead of building there. Building on the VPS (make up-prod) also
# works and needs no registry — this is the optional pre-built-image path.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-dashboard:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-dashboard:latest
