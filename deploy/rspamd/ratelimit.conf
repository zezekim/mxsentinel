# MX Sentinel — rspamd outbound velocity rate-limiting.
#
# Drop-in for /etc/rspamd/local.d/ratelimit.conf on the RELAY HOST (rspamd runs on the
# host alongside Postfix, not in a container — this file CANNOT be applied from the
# mxsentinel containers). After copying, reload rspamd:
#
#   cp deploy/rspamd/ratelimit.conf /etc/rspamd/local.d/ratelimit.conf
#   systemctl reload rspamd
#
# This is the INLINE, real-time brake on outbound velocity: rspamd soft-rejects (a 4xx
# tempfail, so Postfix queues and retries — mail is delayed, not lost) once a bucket is
# exhausted. It is complementary to MX Sentinel's anomalyd daemon, which watches the same
# traffic AFTER the fact and opens an incident when a domain's hourly volume spikes well
# above its learned baseline. rspamd caps the absolute rate; anomalyd catches relative
# anomalies below the cap.
#
# IMPORTANT for a SHARED relay: one SASL credential often relays for hundreds of client
# domains, so a per-user bucket alone is too coarse (it would either be huge — useless —
# or throttle every client when one misbehaves). We therefore key the primary outbound
# buckets on the authenticated user AND on the envelope-from DOMAIN, so a single runaway
# client domain is throttled without taking down the rest. Tune the numbers to your fleet.
#
# Token-bucket semantics (rspamd): "<burst> / <rate>" means a bucket of capacity <burst>
# that refills at <rate>. <rate> accepts a time suffix (s/m/h/d). A message consumes one
# token; when the bucket is empty the action below (soft reject) fires. So
# "200 / 1h" = burst of 200, sustained 200 messages/hour.

# Only rate-limit OUTBOUND, authenticated submission. Inbound/unauthenticated mail is
# scored by rspamd's normal pipeline, not throttled here. `user` is set by the MTA for
# SASL-authenticated sessions; when it's empty this whole module is a no-op for the message.
enabled = true;

# Whitelist: never rate-limit local/trusted networks (loopback, your own infra). Adjust
# to taste — keep it tight on a shared relay so a compromised client can't hide behind it.
whitelisted_rcpts = "postmaster,mailer-daemon";
whitelisted_ip = [
  "127.0.0.0/8",
  "::1",
];

# Count a message against the LIMIT bucket even if it was already pre-counted (we want
# every outbound attempt to draw down the bucket on a shared relay).
max_rcpt = 50;          # messages with > this many recipients skip per-rcpt limits (fan-out guard)

rates {
  # ── Per authenticated submission user ───────────────────────────────────────
  # Coarse cap per SASL login. On a shared relay this is the single cPanel/Exim
  # smarthost credential, so set it high enough not to throttle legitimate aggregate
  # traffic but low enough to blunt a fully-compromised relay. Two buckets: a tighter
  # hourly burst and a daily ceiling.
  user_hourly {
    selector = 'user';
    bucket = {
      burst = 200;          # allow a burst of 200 messages...
      rate = '200 / 1h';    # ...then sustain 200/hour per authenticated user
    }
  }
  user_daily {
    selector = 'user';
    bucket = {
      burst = 2000;         # daily burst headroom
      rate = '2000 / 1d';   # 2000 messages/day per authenticated user
    }
  }

  # ── Per envelope-from DOMAIN ────────────────────────────────────────────────
  # The important bucket for a shared relay: isolates a single misbehaving client
  # domain so it's throttled on its own without affecting the other 499 domains sharing
  # the credential. Tighter than the per-user cap on purpose. `from` resolves to the
  # MAIL FROM address; we key on its domain via the from('smtp').domain selector.
  from_domain_hourly {
    selector = "from('smtp').domain";
    bucket = {
      burst = 150;          # burst of 150 messages for one sending domain...
      rate = '150 / 1h';    # ...then 150/hour sustained per from-domain
    }
  }
  from_domain_daily {
    selector = "from('smtp').domain";
    bucket = {
      burst = 1000;         # daily burst headroom per sending domain
      rate = '1000 / 1d';   # 1000 messages/day per sending domain
    }
  }
}

# When a bucket is exhausted, soft-reject (tempfail). Postfix re-queues and retries, so
# the client is slowed rather than seeing a hard bounce. The message text is returned to
# the submitting client in the SMTP response.
message = "Rate limit exceeded — sending domain is temporarily throttled, please retry later";
