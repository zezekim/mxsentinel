# MX Sentinel — local development stack.
# Brings up the backing services the Phase 1 substrate talks to. Ports and credentials
# match the defaults in internal/config (config.Defaults) and deploy/config/*.yaml.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   MXS_CONFIG=deploy/config/mxsentinel.example.yaml go run ./cmd/mxctl migrate up
#
# Do NOT over-engineer orchestration early (ARCHITECTURE.md §10) — compose only.
#
# Default `up` starts only the backing services (for host-run `go run` development).
# To run the full platform (Go services + dashboard) in containers too, enable the
# "app" profile:
#   docker compose -f deploy/docker-compose.yml --profile app up --build

name: mxsentinel

# Shared environment for the Go services: point them at the compose service hostnames
# (NOT localhost). Note MinIO's S3 API is on container port 9000 here.
x-app-env: &app-env
  MXS_LOGLEVEL: "${MXS_LOGLEVEL:-info}"
  MXS_HTTPADDR: ":9090"
  MXS_POSTGRES_DSN: "postgres://${PG_USER:-mxsentinel}:${PG_PASSWORD:-mxsentinel}@postgres:5432/${PG_DB:-mxsentinel}?sslmode=disable"
  MXS_CLICKHOUSE_ADDR: "clickhouse:9000"
  MXS_CLICKHOUSE_DATABASE: "${CH_DB:-mxsentinel}"
  MXS_REDIS_ADDR: "redis:6379"
  MXS_NATS_URL: "nats://nats:4222"
  MXS_OBJECTSTORE_ENDPOINT: "minio:9000"
  MXS_OBJECTSTORE_BUCKET: "${MINIO_BUCKET:-mxsentinel}"
  MXS_OBJECTSTORE_ACCESSKEY: "${MINIO_ROOT_USER:-minioadmin}"
  MXS_OBJECTSTORE_SECRETKEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  # AI layer: aid expects a local LLM. There is no LLM service in this compose, so point
  # it at one you run yourself (host-run Ollama via host.docker.internal on Docker Desktop;
  # adjust for Linux). aid retries harmlessly until the endpoint is reachable.
  MXS_AI_ENDPOINT: "${MXS_AI_ENDPOINT:-http://host.docker.internal:11434/v1}"
  MXS_AI_MODEL: "${MXS_AI_MODEL:-llama3}"
  # The relay's outbound IP universe. rbld monitors these against DNSBLs; apid's
  # GET /v1/rbl/status reads them at request time to know the full egress-IP set.
  # Comma-separated; falls back to RELAY_NODE_IP (single IP) when unset.
  RELAY_EGRESS_IPS: "${RELAY_EGRESS_IPS:-}"
  RELAY_NODE_IP: "${RELAY_NODE_IP:-}"
  # DMARC pull integration (external receiver)
  MXS_DMARCP_BASEURL: "${MXS_DMARCP_BASEURL:-}"
  MXS_DMARCP_APIKEY: "${MXS_DMARCP_APIKEY:-}"
  MXS_DMARCP_TENANTID: "${MXS_DMARCP_TENANTID:-}"
  MXS_DMARCP_INTERVAL: "${MXS_DMARCP_INTERVAL:-3600}"
  MXS_DMARCP_LOOKBACKDAYS: "${MXS_DMARCP_LOOKBACKDAYS:-30}"
  MXS_DMARCP_EXTRA_HOST: "${MXS_DMARCP_EXTRA_HOST:-}"

# Shared definition for every Go service: one image (built from the root Dockerfile),
# only started under the "app" profile.
x-app: &app
  build:
    context: ..
  image: mxsentinel:local
  profiles: ["app"]
  # Self-heal transient failures (e.g. a daemon starting before NATS is resolvable on a
  # `compose restart`, which doesn't honor depends_on ordering). migrate overrides this to
  # "no" since it's a one-shot job.
  restart: unless-stopped
  environment: *app-env
  # Let containers reach a host-run service (e.g. Ollama) via host.docker.internal on
  # Linux too (already works on Docker Desktop). Harmless when unused.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${PG_USER:-mxsentinel}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:-mxsentinel}"
      POSTGRES_DB: "${PG_DB:-mxsentinel}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-mxsentinel}"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: "${CH_DB:-mxsentinel}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:9000:9000"   # native protocol (internal/store/clickhouse)
      - "127.0.0.1:8123:8123"   # http
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    # alpine variant has a shell + busybox wget; the default nats image is FROM scratch
    # (no shell/wget), so a CMD-SHELL healthcheck can't run there.
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"   # client
      - "127.0.0.1:8222:8222"   # monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "127.0.0.1:9001:9000"   # S3 API (internal/store/objectstore endpoint localhost:9001)
      - "127.0.0.1:9091:9090"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Application services (profile: app) ---------------------------------

  migrate:
    <<: *app
    command: ["/usr/local/bin/mxctl", "migrate", "up"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}

  apid:
    <<: *app
    command: ["/usr/local/bin/apid"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}

  dnsd:
    <<: *app
    command: ["/usr/local/bin/dnsd"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  # Consumes smtp.* events from the bus and lands them in ClickHouse (smtp_events),
  # powering the Message Explorer and per-account history.
  ingestd:
    <<: *app
    command: ["/usr/local/bin/ingestd"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
      clickhouse: {condition: service_healthy}

  correld:
    <<: *app
    command: ["/usr/local/bin/correld"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  # Outbound-abuse guard: consumes SMTP telemetry, auto-suspends an SMTP submission user
  # whose mail recipients are rejecting as spam/blocklisted, and opens an incident.
  abused:
    <<: *app
    command: ["/usr/local/bin/abused"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  incidentd:
    <<: *app
    command: ["/usr/local/bin/incidentd"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  repd:
    <<: *app
    command: ["/usr/local/bin/repd"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  aid:
    <<: *app
    command: ["/usr/local/bin/aid"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  dmarcd:
    <<: *app
    command: ["/usr/local/bin/dmarcd", "--dir", "/drop"]
    volumes:
      - ../dmarc-drop:/drop
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}

  # Pulls DMARC aggregate reports from an external receiver API on a schedule.
  # Requires MXS_DMARCP_BASEURL, MXS_DMARCP_APIKEY, MXS_DMARCP_TENANTID in deploy/.env.
  # If the receiver is on a private host, set MXS_DMARCP_EXTRA_HOST="hostname:ip" in .env.
  dmarcpulld:
    <<: *app
    command: ["/usr/local/bin/dmarcpulld"]
    extra_hosts: "${MXS_DMARCP_EXTRA_HOST:-[]}"
    depends_on:
      migrate: {condition: service_completed_successfully}

  # RBL/DNSBL self-monitor for the relay's own egress IPs. On a ticker (RBL_INTERVAL, default
  # 15m) it checks every RELAY_EGRESS_IPS entry (falls back to RELAY_NODE_IP) against each
  # RBL_ZONES zone, upserts ip_blocklist_status, opens a critical incident on a clean->listed
  # transition, and writes the healthy-IP set to RBL_HEALTHY_IPS_FILE. A HOST-SIDE hook (cron)
  # reads that file to rebuild the Postfix randmap source and run `postfix reload` — rbld never
  # reloads host Postfix itself. The file lives under a bind-mounted host dir so the hook can
  # read it. Spamhaus/etc. may rate-limit cloud resolvers; point the box's resolver at a paid
  # DQS key for production (see deploy/hooks/rbl-rotation-hook.sh and docs).
  rbld:
    <<: *app
    command: ["/usr/local/bin/rbld"]
    environment:
      <<: *app-env
      RELAY_EGRESS_IPS: "${RELAY_EGRESS_IPS:-}"
      RELAY_NODE_IP: "${RELAY_NODE_IP:-}"
      RBL_ZONES: "${RBL_ZONES:-}"
      RBL_INTERVAL: "${RBL_INTERVAL:-15m}"
      RBL_LOOKUP_TIMEOUT: "${RBL_LOOKUP_TIMEOUT:-5s}"
      RBL_HEALTHY_IPS_FILE: "/var/lib/mxsentinel/healthy-ips"
    volumes:
      # Host dir holding the healthy-IPs file the host-side rotation hook reads. Writable so
      # rbld can update it atomically (temp file + rename).
      - "${RBL_HEALTHY_IPS_DIR:-../rbl-state}:/var/lib/mxsentinel"
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  # Send-volume anomaly detector: consumes SMTP telemetry, keeps a per-(tenant, sender
  # domain) EWMA hourly baseline, and opens a critical incident when a domain's current-hour
  # volume spikes well above baseline. Complements rspamd's inline rate caps (host-side).
  anomalyd:
    <<: *app
    command: ["/usr/local/bin/anomalyd"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  # Feedback-loop (ARF) ingestion + Gmail Postmaster reputation. Watches /fbl-drop for ARF
  # complaint emails (route abuse@ there), records per-domain complaints, and—when
  # GOOGLE_POSTMASTER_TOKEN is set—pulls domain reputation + spam rate.
  fbld:
    <<: *app
    command: ["/usr/local/bin/fbld", "--dir", "/fbl-drop"]
    volumes:
      - ../fbl-drop:/fbl-drop
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  # SASL credential-compromise detection: per-credential behavioral signals (recipient
  # blasting, bounce spikes, volume) from SMTP telemetry. Auto-lock is opt-in
  # (AUTHWATCH_AUTOLOCK=true) since the shared relay credential serves every client.
  authwatchd:
    <<: *app
    command: ["/usr/local/bin/authwatchd"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  dashboard:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_BASE: "http://localhost:8080"
    image: mxsentinel-dashboard:local
    profiles: ["app"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - apid

  # telemetryd tails the host's Postfix maillog, so it only makes sense when the relay
  # runs on this box. It's under the "relay" profile — enable with `--profile relay` (in
  # addition to `--profile app`). Set RELAY_NODE_IP / MAILLOG_PATH / MXS_TELEMETRY_HASHKEY
  # in deploy/.env. See docs/deploy-relay.md.
  telemetryd:
    <<: *app
    profiles: ["relay"]
    # Follow the maillog by its real host path (the log directory is mounted below, not the
    # single file) so telemetryd can reopen it after logrotate/postlogd replaces the inode.
    command: ["/usr/local/bin/telemetryd", "--follow", "${MAILLOG_PATH:-/var/log/mail.log}", "--node-ip", "${RELAY_NODE_IP:-}", "--fallback-tenant-slug", "${MXS_FALLBACK_TENANT_SLUG:-}"]
    # The host maillog is 0640 root:adm; join the adm group (GID 4 on Debian/Ubuntu) so the
    # container can read it without making the log world-readable. If `getent group adm`
    # shows a different GID on your host, change this to match.
    group_add: ["4"]
    environment:
      <<: *app-env
      MXS_TELEMETRY_HASHKEY: "${MXS_TELEMETRY_HASHKEY:-}"
    volumes:
      # Mount the log's DIRECTORY (read-only), not the single file — a single-file bind mount
      # pins one inode, so a rotated log becomes invisible. The dir mount lets telemetryd
      # reopen the current file by path.
      - "${MAILLOG_DIR:-/var/log}:${MAILLOG_DIR:-/var/log}:ro"
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

volumes:
  pgdata:
  chdata:
  natsdata:
  miniodata:
