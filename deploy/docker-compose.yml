# MX Sentinel — local development stack.
# Brings up the backing services the Phase 1 substrate talks to. Ports and credentials
# match the defaults in internal/config (config.Defaults) and deploy/config/*.yaml.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   MXS_CONFIG=deploy/config/mxsentinel.example.yaml go run ./cmd/mxctl migrate up
#
# Do NOT over-engineer orchestration early (ARCHITECTURE.md §10) — compose only.

name: mxsentinel

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mxsentinel
      POSTGRES_PASSWORD: mxsentinel
      POSTGRES_DB: mxsentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mxsentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: mxsentinel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "9000:9000"   # native protocol (internal/store/clickhouse)
      - "8123:8123"   # http
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9000"   # S3 API (internal/store/objectstore endpoint localhost:9001)
      - "9091:9090"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  chdata:
  natsdata:
  miniodata:
