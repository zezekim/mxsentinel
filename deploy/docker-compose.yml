# MX Sentinel — local development stack.
# Brings up the backing services the Phase 1 substrate talks to. Ports and credentials
# match the defaults in internal/config (config.Defaults) and deploy/config/*.yaml.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   MXS_CONFIG=deploy/config/mxsentinel.example.yaml go run ./cmd/mxctl migrate up
#
# Do NOT over-engineer orchestration early (ARCHITECTURE.md §10) — compose only.
#
# Default `up` starts only the backing services (for host-run `go run` development).
# To run the full platform (Go services + dashboard) in containers too, enable the
# "app" profile:
#   docker compose -f deploy/docker-compose.yml --profile app up --build

name: mxsentinel

# Shared environment for the Go services: point them at the compose service hostnames
# (NOT localhost). Note MinIO's S3 API is on container port 9000 here.
x-app-env: &app-env
  MXS_LOGLEVEL: info
  MXS_HTTPADDR: ":9090"
  MXS_POSTGRES_DSN: "postgres://mxsentinel:mxsentinel@postgres:5432/mxsentinel?sslmode=disable"
  MXS_CLICKHOUSE_ADDR: "clickhouse:9000"
  MXS_CLICKHOUSE_DATABASE: "mxsentinel"
  MXS_REDIS_ADDR: "redis:6379"
  MXS_NATS_URL: "nats://nats:4222"
  MXS_OBJECTSTORE_ENDPOINT: "minio:9000"
  MXS_OBJECTSTORE_BUCKET: "mxsentinel"
  MXS_OBJECTSTORE_ACCESSKEY: "minioadmin"
  MXS_OBJECTSTORE_SECRETKEY: "minioadmin"

# Shared definition for every Go service: one image (built from the root Dockerfile),
# only started under the "app" profile.
x-app: &app
  build:
    context: ..
  image: mxsentinel:local
  profiles: ["app"]
  environment: *app-env

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mxsentinel
      POSTGRES_PASSWORD: mxsentinel
      POSTGRES_DB: mxsentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mxsentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: mxsentinel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "9000:9000"   # native protocol (internal/store/clickhouse)
      - "8123:8123"   # http
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9000"   # S3 API (internal/store/objectstore endpoint localhost:9001)
      - "9091:9090"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Application services (profile: app) ---------------------------------

  migrate:
    <<: *app
    command: ["/usr/local/bin/mxctl", "migrate", "up"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}

  apid:
    <<: *app
    command: ["/usr/local/bin/apid"]
    ports:
      - "8080:8080"
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}

  dnsd:
    <<: *app
    command: ["/usr/local/bin/dnsd"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  correld:
    <<: *app
    command: ["/usr/local/bin/correld"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  incidentd:
    <<: *app
    command: ["/usr/local/bin/incidentd"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  repd:
    <<: *app
    command: ["/usr/local/bin/repd"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  dmarcd:
    <<: *app
    command: ["/usr/local/bin/dmarcd", "--dir", "/drop"]
    volumes:
      - ../dmarc-drop:/drop
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}

  dashboard:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_BASE: "http://localhost:8080"
    image: mxsentinel-dashboard:local
    profiles: ["app"]
    ports:
      - "3000:3000"
    depends_on:
      - apid

  # telemetryd is intentionally not in the default app profile — it tails a host maillog.
  # Run it ad hoc against the same image, mounting your log:
  #   docker compose -f deploy/docker-compose.yml run --rm \
  #     -v /var/log/maillog:/maillog:ro apid /usr/local/bin/telemetryd --follow /maillog

volumes:
  pgdata:
  chdata:
  natsdata:
  miniodata:
