# MX Sentinel — production overlay. Layer ON TOP of docker-compose.yml:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --profile app --env-file deploy/.env up -d --build
#
# Adds a Caddy reverse proxy that terminates TLS (automatic Let's Encrypt) and serves a
# single domain: /v1/* -> apid, everything else -> the dashboard (same origin, no CORS).
# Caddy is the only publicly-exposed service; all backing services stay on 127.0.0.1 /
# the internal network (see the base compose). Secrets come from deploy/.env.
#
# See docs/deploy-vps.md for the full runbook.

name: mxsentinel

services:
  caddy:
    image: caddy:2
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MXS_DOMAIN: "${MXS_DOMAIN:?set MXS_DOMAIN in deploy/.env}"
      # Optional extra hostnames for the same site (space separated). Empty = single domain.
      MXS_EXTRA_DOMAINS: "${MXS_EXTRA_DOMAINS:-}"
      MXS_ACME_EMAIL: "${MXS_ACME_EMAIL:?set MXS_ACME_EMAIL in deploy/.env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - apid
      - dashboard

  # The dashboard is served same-origin behind Caddy, so the browser should call
  # /v1/... on whatever hostname served the page (see web/lib/api-base.ts). That is what
  # lets MXS_EXTRA_DOMAINS work from one build — an absolute base would pin every request
  # back to MXS_DOMAIN, so a white-label domain would still call the primary one.
  dashboard:
    build:
      args:
        NEXT_PUBLIC_API_BASE: "same-origin"

volumes:
  caddydata:
  caddyconfig:
