# MX Sentinel — example service configuration.
# These values mirror config.Defaults() and deploy/docker-compose.yml. Copy to
# mxsentinel.yaml and adjust, or override any value with an MXS_* environment variable
# (e.g. MXS_POSTGRES_DSN=...). Secrets belong in env/Vault, not in committed files.

service: mxsentinel
loglevel: info
httpaddr: ":9090"   # health (/healthz) + metrics (/metrics)

postgres:
  dsn: "postgres://mxsentinel:mxsentinel@localhost:5432/mxsentinel?sslmode=disable"
  maxconns: 10

clickhouse:
  addr: "localhost:9000"
  database: "mxsentinel"
  username: "default"
  password: ""

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

nats:
  url: "nats://localhost:4222"

objectstore:
  endpoint: "localhost:9001"
  region: "us-east-1"
  bucket: "mxsentinel"
  accesskey: "minioadmin"
  secretkey: "minioadmin"
  usessl: false

# AI reasoning layer (Phase 3): a local, OpenAI-compatible LLM (Ollama/vLLM/llama.cpp).
# Metadata only — never message bodies.
ai:
  endpoint: "http://localhost:11434/v1"   # Ollama default
  model: "llama3"
  apikey: ""
  timeoutsecs: 60
