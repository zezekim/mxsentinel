# WHM AppConfig registration for the MX Sentinel admin plugin.
# Registered with: /usr/local/cpanel/bin/register_appconfig mxsentinel.conf
# The CGI is installed to /usr/local/cpanel/whostmgr/docroot/cgi/mxsentinel/index.cgi
name=mxsentinel
service=whostmgr
displayname=MX Sentinel
url=/cgi/mxsentinel/index.cgi
entryurl=cgi/mxsentinel/index.cgi
target=_self
# acls=any lets any WHM operator with a login open it; tighten to e.g. all if desired.
acls=any
